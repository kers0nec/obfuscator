<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>67 Obfuscator</title><link rel="stylesheet" href="./style.css"></head>
<body><div class="glow a"></div><div class="glow b"></div>
<header><div class="brand"><b>67</b><span>Obfuscator<small>Clyde Luau engine</small></span></div><em><i></i> Engine ready</em></header>
<main><section class="hero"><div><label>SOURCE PROTECTION</label><h1>Make your Lua harder to read.</h1><p>Fast Luau-aware protection powered by the integrated 67 engine.</p></div><div class="actions"><button id="upload">Upload file</button><button id="run">Obfuscate <kbd>⌘↵</kbd></button><input id="file" type="file" hidden></div></section>
<section class="grid"><article><nav><span>INPUT</span><div><button id="sample">Sample</button><button id="clear">Clear</button></div></nav><textarea id="input" spellcheck="false" placeholder="Paste Lua / Luau here…"></textarea><footer id="ins">0 lines · 0 chars</footer></article>
<article><nav><span>OUTPUT</span><div><button id="copy">Copy</button><button id="download">Download</button></div></nav><textarea id="output" readonly spellcheck="false" placeholder="Protected output will appear here…"></textarea><footer id="outs">0 lines · 0 chars</footer></article></section>
<section class="options"><label><input id="rename" type="checkbox" checked> Rename locals</label><label><input id="strings" type="checkbox" checked> Encode strings</label><label><input id="controlflow" type="checkbox" checked> Scramble control flow</label><label><input id="comments" type="checkbox"> Keep comments (legacy)</label></section>
<div id="fileinfo"></div><div id="msg">Ready.</div></main><script src="./app.js"></script></body></html>
